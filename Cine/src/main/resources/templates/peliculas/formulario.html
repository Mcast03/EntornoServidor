<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nueva Pelicula</title>
</head>
<body>
	<h1>Nueva Pelicula</h1>
	
	<form
		th:action="@{/peliculas/guardar}"
		th:object="@{pelicula}"
		method="post">
		<p>
			<label>Titulo </input type="hidden" th:field="*{id}"></label>
			<label>Titulo </input type="text" th:field="*{titulo}"></label>
			<span th:if="${#fields.hasErrors()'titulo')}"></span>
		</p>
	
	<button type="submit">Guardar</button>
	</form>
</body>
</html>
