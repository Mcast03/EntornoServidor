<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1 th:text="${pelicula.titulo}"></h1>
	<ul>
		<li th:text="|Anio: ${pelicula.anio}|"></li>

</html>
