<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>Crear</h1>
	<form th:action="@{/producto/guardar}"
	method="post"
	th:object="${producto}">
	<input type="text" th:field="*{id}" hidden/>
	<p>Nombre
		<input type="text" th:field="*{nombre}"/><br/>
		<span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: red"></span>
	</p>
	<p>Marca
		<input type="text" th:field="*{marca}"/><br/>
		<span th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}" style="color: red"></span>
	</p>
	<p>Precio
		<input type="text" th:field="*{precio}"/><br/>
		<span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" style="color: red"></span>
	</p>
	<p>Cantidad en stock
		<input type="text" th:field="*{stock}"/><br/>
		<span th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" style="color: red"></span>
	</p>
	<p>En oferta?
		<input type="checkbox" th:field="*{enOferta}"/>
	</p>
	<p>Categoria
		<select th:field="*{categoria}">
			<option value="">Seleccione una opcion</option>
			<option th:each="c : ${categoria}"
			th:text="${c}"
			th:value="${c}"></option>
		</select>
		<span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" style="color: red"></span>
	</p>
	<button type="submit">Guardar</button>
	</form>
</body>
</html>
