<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>Productos</h1>
	<form th:action="@{/producto/lista}" method="get">
	<label>Categoria
		<select th:selected="${categoria}" name="categoria">
			<option value="">Seleccione una opcion</option>
			<option th:each="c : ${categoria}"
			th:text="${c}"
			th:value="${c}"></option>
		</select>
	</label>
	<label>En Oferta
		<input type="checkbox" name="oferta"/>
	</label>
	<button type="submit">Filtrar</button>
	</form>
	<table border=1px>
		<thead>
			<tr>
				<td>Nombre</td>
				<td>Marca</td>
				<td>Precio</td>
				<td>Stock</td>
				<td>Categoria</td>
				<td colspan="3">Acciones</td>
			</tr>
		</thead>
		<tbody>
			<tr th:each="producto:${producto}">
				<td th:text="${producto.nombre}"></td>
				<td th:text="${producto.marca}"></td>
				<td th:text="|${producto.precio} euros|"></td>
				<td th:text="${producto.stock}"></td>
				<td th:text="${producto.categoria}"></td>
				<td>
					<form th:action="@{/producto/ficha/{id} (id = ${producto.id})}">
						<button type="submit">Ver</button>
					</form>
				</td>
				<td>
					<form th:action="@{/producto/editar/{id} (id = ${producto.id})}">
						<button type="submit">Editar</button>
					</form>
				</td>
				<td>
					<form th:action="@{/producto/borrar/{id} (id = ${producto.id})}" method="post">
						<button type="submit">Borrar</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	<form th:action="@{/producto/crear}">
		<button type="submit">Crear</button>
	</form>
</body>
</html>
