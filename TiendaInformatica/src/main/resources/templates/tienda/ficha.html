<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title th:text="${producto.nombre}"></title>
</head>
<body>
	<h1 th:text="${producto.nombre}"></h1>
	
	<ul>
		<li th:text="|ID: ${producto.id}|"></li>
		<li th:text="|Marca: ${producto.marca}|"></li>
		<li th:text="|Precio: ${producto.precio}|"></li>
		<li th:text="|Categoria: ${producto.categoria}|"></li>
		<li th:text="${producto.stock}>0 ? 'Unidades Disponibles: '+${producto.stock}:'Sin stock'"></li>
		<li th:if="${producto.enOferta}" th:text="${producto.enOferta}? 'En Oferta!':''"></li>
	</ul>
</body>
</html>
