<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title th:text="${libro.id}==0? 'Crear Libro':'Editar Libro'"></title>
<link rel="stylesheet" type="text/css" href="/css/estilo.css">
</head>
<body>
	<h1 th:text="${libro.id}==0? 'Crear Libro':'Editar Libro'"></h1>
	
	<form th:action="@{/biblioteca/guardar}"
	th:object="${libro}"
	method="post">
		<input th:field="*{id}" hidden/>
		<label>Titulo
			<input th:field="*{titulo}" type="text"/>
			<span th:if="#{fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
		</label><br/>
		<label>Paginas
			<input th:field="*{paginas}" type="text"/>
			<span th:if="#{fields.hasErrors('paginas')}" th:errors="*{paginas}"></span>
		</label><br/>
		<label>Autor
			<input th:field="*{autor}" type="text"/>
			<span th:if="#{fields.hasErrors('autor')}" th:errors="*{autor}"></span>
		</label><br/>
		<label>Anio
			<input th:field="*{anio}" type="number"/>
			<span th:if="#{fields.hasErrors('anio')}" th:errors="*{anio}"></span>
		</label><br/>
		<label>Disponible
			<input type="checkbox"/>
		</label><br/>
		<label>Genero
			<select th:field="*{genero}">
				<option value="">Elige un genero</option>
				<option th:each="g : ${generos}"
				th:value="${g}"
				th:text="${g}">Genero
				</option>
			</select>
			<span th:if="#{fields.hasErrors('genero')}" th:errors="*{genero}"></span>
		</label><br/>
		<button type="submit">Guardar</button>
	</form>
</body>
</html>
