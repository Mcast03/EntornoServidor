<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${titulo}"></title>
</head>
<body>
	<h1 th:text="${titulo}"></h1>
	<h2>Todos los animales</h2>
	<form th:action="@{/animal/todos}" method="get">
		<label for="tipo">Tipo</label>
		<select id="tipo" name="tipo">
			<option value="">Todos</option>
			<option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == tipo}"></option>
		</select>
		<input type="checkbox" id="soloOferta" name="soloOferta" value="true" th:checked="${soloOferta}">
		<label for="soloOferta">Solo en oferta</label>
		<button type="submit">Filtrar</button>
		<a th:href="@{/animal/todos}">Quitar filtro</a>
	</form>
	<p th:if="${animales == null || animales.size == 0}">No hay animales que mostrar</p>

	<table th:unless="${animales == null || animales.size == 0}" border=1>
		<thead>
			<tr>
				<th>Id</th>
				<th>Especie</th>
				<th>Cantidad</th>
				<th>Precio</th>
				<th>Tipo</th>
				<th>Oferta</th>
				<th>Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="animal : ${animales}">
				<td th:text="${animal.id}"></td>
				<td th:text="${animal.especie}"></td>
				<td th:text="${animal.cantidad}"></td>
				<td th:text="${animal.precio} + ' €'"></td>
				<td th:text="${animal.tipo}"></td>
				<td th:text="${animal.oferta} ? 'Sí' : 'No'"></td>
				<td>
					<a th:href="@{'/animal/id/' + ${animal.id}}">Ver</a>
				</td>
			</tr>
		</tbody>
	</table>

</body>
</html>
