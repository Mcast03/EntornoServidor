<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title th:text="${cancion.titulo}"></title>
<link rel="stylesheet" type="text/css" href="/css/estilo.css">
</head>
<body>
	<h1 th:text="${cancion.titulo}"></h1>
	<ul>
		<li th:text="|Id: ${cancion.id}|"></li>
		<li th:text="|Album: ${cancion.album}|"></li>
		<li th:text="|Anio: ${cancion.anio}|"></li>
		<li th:text="|Duracion: ${cancion.duracionSegundos} segundos|"></li>
		<li th:text="${cancion.reproducciones}>100? 'Es un Exitazo!!!!':'Reproducciones: ' + ${cancion.reproducciones} + ' millones'"></li>
		<li th:text="|Estilo: ${cancion.estilo}|"></li>
		<li th:if="${cancion.single}" th:text="${cancion.single}? 'Single':''"></li>
	</ul>
</body>
</html>
