<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title th:text="${juego.titulo}"></title>
<link rel="stylesheet" th:href="@{/css/estilos.css}" />
</head>
<header th:replace="~{fragmentos/comun::cabecera}">Cabecera</header>
<body>
	<h1 th:text="${juego.titulo}"></h1>
	<p th:text="|Anio: ${juego.anio}|"></p>

	<p th:text="|Copias Vendidas: ${juego.copiasVendidas}|"></p>

</body>
</html>
