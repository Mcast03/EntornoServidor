<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title th:text="${videojuego.id == 0}? 'Nuevo Juego':'Editar Juego'"></title>
<link rel="stylesheet" th:href="@{/css/estilos.css}" />
</head>
<header th:replace="~{fragmentos/comun::cabecera}">Cabecera</header>
<body>
	<h1 th:text="${videojuego.id == 0}? 'Nuevo Juego':'Editar Juego'"></h1>
	<form th:action="@{/videojuego/guardar}" method="post"
		th:object="${videojuego}" novalidate>
		<label> <input type="hidden" th:field="*{id}" />
		</label><br /> <label>Titulo <input type="text" th:field="*{titulo}" />
			<span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"
			style="color: red"></span>
		</label><br /> <label>Anio <input type="number" th:field="*{anio}" />
			<span th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"
			style="color: red"></span>
		</label><br /> <label>Copias Vendidas <input type="number"
			th:field="*{copiasVendidas}" /> <span
			th:if="${#fields.hasErrors('copiasVendidas')}"
			th:errors="*{copiasVendidas}" style="color: red"></span>
		</label> <br /> <label>En oferta <input type="checkbox"
			th:field="*{enOferta}" />
		</label><br /> <label>Plataforma <select th:field="*{plataforma}">
				<option value="">Elige una Plataforma</option>
				<option th:each="p : ${plataforma}" th:value="${p}" th:text="${p}">Plataforma</option>
		</select></label><br /> <span th:if="${#fields.hasErrors('plataforma')}"
			th:errors="*{plataforma}" style="color: red"></span><br />
		<button type="submit">Guardar</button>
	</form>
</body>
</html>
