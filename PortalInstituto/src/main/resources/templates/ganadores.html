<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1 th:text="'Numeros ganadores de ' + ${pais}"></h1>
	<table>
		<thead>
			<td>Numero</td>
			<td>Premio</td>
		</thead>
		<tr th:each=" ganador : ${ganadores}">
			<td th:text="${ganador}"></td>
			<td th:text="${ganador}*4"></td>
		</tr>
	</table>
	<a th:href="@{/loto/menu}">Volver a loto</a>
	<a th:href="@{/home}">Volver a inicio</a>
</body>
</html>
