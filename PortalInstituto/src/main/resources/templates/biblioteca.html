<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>Esta es la biblioteca</h1>
	
	<table border=1>
		<thead>
			<td>Autor</td>
			<td>Titulo</td>
			<td>Numero de ejemplares</td>
			<td>Genero</td>
			<td>Accion</td>
		</thead>
		
		<tr th:each="libro : ${libros}">
			<td th:text="${libro.autor}"></td>
			<td><a th:href="@{'/libros/id/'} + ${libro.id}" th:text="${libro.titulo}"></a></td>
			<td th:text="${libro.numeroEjemplares}"></td>
			<td><a th:href="@{'/libros/genero/'} + ${libro.genero}" th:text="${libro.genero}"></a></td>
			<td> <button>Borrar</button> <button>Editar</button></td>
		</tr>
	</table>
	<a th:href="@{/libros/lista}">Volver a la biblioteca</a></br>
	<a th:href="@{/home}">Volver a inicio</a></br>
	<a th:href="@{/libros/formulario}">Añadir libro</a>
</body>
</html>
