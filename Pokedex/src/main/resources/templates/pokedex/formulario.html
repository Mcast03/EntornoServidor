<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Anadir</title>
</head>
<body>
	<h1>Anadir nuevo pokemon</h1>
	<form 
	th:action="@{/pokemon/guardar}" 
	method="post"
	th:object="${pokemon}"
	novalidate>
		<input type="number" th:field="*{id}" hidden/>
		<p>Nombre
		<input type="text" th:field="*{nombre}"/><br/>
		<span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style=color:red></span>
		</p>
		<p>Peso
		<input type="text" th:field="*{peso}"/><br/>
		<span th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}" style=color:red></span>
		</p>
		<p>Nivel
		<input type="text" th:field="*{nivel}"/><br/>
		<span th:if="${#fields.hasErrors('nivel')}" th:errors="*{nivel}" style=color:red></span>
		</p>
		<p>Numero de la Pokedex
		<input type="text" th:field="*{numeroPokedex}"/><br/>
		<span th:if="${#fields.hasErrors('numeroPokedex')}" th:errors="*{numeroPokedex}" style=color:red></span>
		</p>
		<p>Es Legendario?
		<input type="checkbox" th:field="*{legendario}"/><br/>
		</p>
		<p>Tipo
		<select th:field="*{tipo}">
			<option th:each="t:${tipo}"
			th:text="${t}"
			th:value="${t}"
			>Tipo</option>
		</select>
		<span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" style=color:red></span>
		</p>
		<button type="submit">Guardar</button>
	</form>
</body>
</html>
