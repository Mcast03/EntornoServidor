<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokedex</title>
</head>
<body>
	<h1>Pokedex</h1>
	<form th:action="@{/pokemon/lista}" method="get">
			<label>Tipo
			<select th:selected="${tipo}" name=tipo>
				<option value="">Elige el tipo</option>
				<option th:each="t:${tipo}"
				th:value="${t}"
				th:text="${t}"
				>Tipo</option>
			</select></label>
			<label>Legendario<input type="checkbox" th:checked="${legendario}" name=legendario value="true"></label>
			<button type="submit">Filtrar</button>
	</form>
	<table border=1px th:if="#{lists.isEmpty(pokemon)}">
		<thead>
			<tr>
				<td>Numero Pokedex</td>
				<td>Nombre</td>
				<td>Nivel</td>
				<td>Tipo</td>
				<td colspan="2">Accion</td>
			</tr>
		</thead>
		<tbody>
			<tr th:each="p:${pokemon}">
				<td th:text="${p.numeroPokedex}"></td>
				<td th:text="${p.nombre}"></td>
				<td th:text="${p.nivel}"></td>
				<td th:text="${p.tipo}"></td>
				<td>
					<form th:action="@{/pokemon/ficha/{id}(id=${p.id})}">
						<button type="submit">Ver</button>
					</form>
				</td>
				<td>
					<form th:action="@{/pokemon/borrar/{id}(id=${p.id})}" method="post">
						<button type="submit">Borrar</button>
					</form>
				</td>
				<td>
					<form th:action="@{/pokemon/editar/{id}(id=${p.id})}">
						<button type="submit">Editar</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	<form th:action="@{/pokemon/anadir}">
		<button type="submit">Anadir</button>
	</form>
</body>
</html>
