<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1 th:text="${pokemon.nombre}"></h1>
	<p th:text="|Nivel: ${pokemon.nivel}|"></p>
	<p th:text="|Peso: ${pokemon.peso}|"></p>
	<p th:text="|Numero de Pokedex: ${pokemon.numeroPokedex}|"></p>
	<p th:text="|Id: ${pokemon.id}|"></p>
	<p th:text="|Tipo: ${pokemon.tipo}|"></p>
	<p th:text="${pokemon.legendario}? 'Es legendario!':''"></p>
</body>
</html>
